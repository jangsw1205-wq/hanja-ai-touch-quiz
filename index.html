<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 한자 터치 퀴즈</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;font-family:system-ui,sans-serif;color:#202124}
.wrap{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px #0001}
h1{text-align:center}textarea{width:100%;min-height:150px;border:1px solid #ddd;border-radius:14px;padding:14px;font-size:16px}
button,select{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700}.primary{width:100%;background:#222;color:#fff;margin-top:12px}.sample{width:100%;margin-top:8px;background:#eee}
.settings{display:flex;margin:10px 0}select{width:100%;border:1px solid #ddd}.hint,.status,.mode{font-size:13px;color:#777}.hidden{display:none}
.top{display:flex;justify-content:space-between;color:#666}.question{text-align:center;padding:25px 5px}.prompt{font-size:62px;font-weight:800}.sub{font-size:24px;font-weight:750;min-height:32px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#f0f2f6;min-height:80px}.choice.correct{background:#dff6e7}.choice.wrong{background:#ffe1e1}
.feedback{text-align:center;font-weight:700;min-height:25px;margin-top:12px}.next{width:100%;background:#222;color:#fff;margin-top:10px}
.stats{display:flex;justify-content:space-around;text-align:center}.stats b{display:block;font-size:24px}
</style></head><body><div class="wrap"><h1>AI 한자 터치 퀴즈</h1>
<section id="setup" class="card"><h3>한자와 음훈 입력</h3>
<textarea id="input" placeholder="日:날 일&#10;月:달 월&#10;火:불 화&#10;水:물 수"></textarea>
<p class="hint">한 줄에 한자:음훈 형식으로 입력하세요. AI가 모양·음·훈이 비슷한 오답을 골라줍니다.</p>
<div class="settings"><select id="mode"><option value="random">문제 방향 랜덤</option><option value="toMeaning">한자 → 음훈</option><option value="toHanja">음훈 → 한자</option></select></div>
<button class="sample" onclick="sample()">예시 입력</button><button class="primary" onclick="start()">AI 퀴즈 시작</button></section>

<section id="quiz" class="hidden"><div class="card"><div class="top"><span id="progress"></span><span id="score"></span></div>
<p id="status" class="status">AI가 선택지를 만드는 중...</p><div class="question"><div id="prompt" class="prompt"></div><div id="sub" class="sub"></div><div id="modeText" class="mode"></div></div>
<div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><button id="next" class="next hidden" onclick="nextQuestion()">다음 문제</button></div>
<div class="card stats"><div><b id="correct">0</b>정답</div><div><b id="wrong">0</b>오답</div><div><b id="accuracy">0%</b>정답률</div></div>
<button class="sample" onclick="location.reload()">처음으로</button></section></div>
<script>
let cards=[],current=null,answered=false,correct=0,wrong=0,q=0,total=10,direction="";
const $=id=>document.getElementById(id);
function sample(){$("input").value=`日:날 일
月:달 월
火:불 화
水:물 수
木:나무 목
金:쇠 금
土:흙 토
山:뫼 산
川:내 천
人:사람 인
大:큰 대
小:작을 소
學:배울 학
生:날 생
友:벗 우`;}
function parse(){return $("input").value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(x=>{let i=x.indexOf(":");return i<0?null:{hanja:x.slice(0,i).trim(),meaning:x.slice(i+1).trim(),weight:1}}).filter(Boolean)}
function pick(){let s=cards.reduce((a,c)=>a+c.weight,0),r=Math.random()*s;for(const c of cards){r-=c.weight;if(r<=0)return c}return cards.at(-1)}
async function start(){cards=parse();if(cards.length<4){alert("최소 4개의 한자:음훈을 입력해주세요.");return}$("setup").classList.add("hidden");$("quiz").classList.remove("hidden");correct=wrong=q=0;nextQuestion()}
async function nextQuestion(){answered=false;$("next").classList.add("hidden");$("feedback").textContent="";current=pick();q++;direction=$("mode").value;if(direction==="random")direction=Math.random()<.5?"toMeaning":"toHanja";let m=direction==="toMeaning";$("prompt").textContent=m?current.hanja:current.meaning;$("modeText").textContent=m?"한자 → 음훈":"음훈 → 한자";$("progress").textContent=`${q} / ${total}`;$("score").textContent=`정답 ${correct}`;$("status").textContent="AI가 헷갈리는 선택지를 만드는 중...";$("choices").innerHTML="";
try{let r=await fetch("/api/distractors",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cards,target:current,direction})});let d=await r.json();if(!r.ok)throw Error(d.error||"오류");let key=m?"meaning":"hanja";[current,...d.distractors].sort(()=>Math.random()-.5).forEach(c=>{let b=document.createElement("button");b.className="choice";b.textContent=c[key];b.onclick=()=>answer(c[key],key);$("choices").appendChild(b)});$("status").textContent="AI가 고른 헷갈리는 선택지"}catch(e){$("status").textContent="AI 오류: "+e.message}}
function answer(choice,key){if(answered)return;answered=true;let ans=current[key];document.querySelectorAll(".choice").forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add("correct");if(b.textContent===choice&&choice!==ans)b.classList.add("wrong")});if(choice===ans){correct++;current.weight=Math.max(1,current.weight-.25);$("feedback").textContent="⭕ 정답!"}else{wrong++;current.weight=Math.min(8,current.weight+2);$("feedback").textContent="❌ 정답: "+ans}$("correct").textContent=correct;$("wrong").textContent=wrong;$("accuracy").textContent=Math.round(correct/(correct+wrong)*100)+"%";$("next").classList.remove("hidden");$("next").textContent=q>=total?"다시 풀기":"다음 문제"}
</script></body></html>
